name: Release

# 触发：推送 v* tag（或手动 dispatch）。
# 产物：dist/ClipLite-<ver>.dmg。配置了 Developer ID + 公证 secrets 时，自动做
#       Hardened Runtime 签名 + notarytool 公证 + staple；否则回退本地/自签构建。
# 之后：创建 GitHub Release（附 DMG），并在配了 TAP_PAT 时自动更新 Homebrew tap。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version: { description: "版本号（不含 v），如 0.1.1", required: true }

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    env:
      KEYCHAIN: ${{ github.workspace }}/build.keychain
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if release already exists
        id: skip
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release 已存在，跳过（保护已发布/手动引导版本）"
            echo exists=true >> "$GITHUB_OUTPUT"
          else
            echo exists=false >> "$GITHUB_OUTPUT"
          fi

      - name: Set up signing keychain
        if: steps.skip.outputs.exists == 'false' && secrets.DEV_ID_CERT_P12_B64 != ''
        run: |
          set -e
          echo "$P12_B64" | base64 --decode > cert.p12
          security create-keychain -p "$RUNNER_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_PASS" "$KEYCHAIN"
          rm cert.p12
          ID="$(security find-identity -p codesigning -v | grep -m1 'Developer ID Application' | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "CLIPITE_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "签名身份：$ID"
        env:
          P12_B64: ${{ secrets.DEV_ID_CERT_P12_B64 }}
          P12_PASS: ${{ secrets.DEV_ID_CERT_PASSWORD }}
          RUNNER_PASS: runnerpass

      - name: Build DMG (sign + notarize + staple)
        if: steps.skip.outputs.exists == 'false'
        run: bash scripts/build-dmg.sh
        env:
          CLIPITE_SIGN_IDENTITY: ${{ env.CLIPITE_SIGN_IDENTITY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_B64 }}

      - name: Export DMG info
        if: steps.skip.outputs.exists == 'false'
        id: info
        run: |
          DMG="$(ls dist/*.dmg | head -1)"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
        env: { TAG: "${{ steps.ver.outputs.tag }}" }

      - name: Create GitHub Release
        if: steps.skip.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: ${{ steps.info.outputs.dmg }}
          generate_release_notes: true
          body: |
            ${{ env.CLIPITE_SIGN_IDENTITY && 'Developer ID 签名 + Apple 公证（Gatekeeper 可直接打开）。' || '自签名未公证：首次打开请右键→打开。' }}

            DMG sha256：`${{ steps.info.outputs.sha }}`

      - name: Update Homebrew tap
        if: steps.skip.outputs.exists == 'false' && secrets.TAP_PAT != ''
        env:
          TAP_PAT: ${{ secrets.TAP_PAT }}
          OWNER: ${{ github.repository_owner }}
          VER: ${{ steps.info.outputs.ver }}
          SHA: ${{ steps.info.outputs.sha }}
        run: |
          set -e
          git clone "https://x-access-token:${TAP_PAT}@github.com/${OWNER}/homebrew-cliplite.git" tap
          cat > tap/Casks/cliplite.rb <<EOF
          cask "cliplite" do
            arch arm: "arm64"

            version "${VER}"
            sha256 arm: "${SHA}"

            url "https://github.com/${OWNER}/ClipLite/releases/download/v#{version}/ClipLite-#{version}.dmg"
            name "ClipLite"
            desc "极低内存的 macOS 截图 / 贴图 / 标注 / OCR 工具"
            homepage "https://github.com/${OWNER}/ClipLite"

            depends_on macos: :sonoma

            livecheck do
              url "https://github.com/${OWNER}/ClipLite"
              strategy :github_latest
            end

            app "ClipLite.app"

            zap trash: "~/Library/Preferences/com.lianyi.cliplite.plist"
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/cliplite.rb
          git commit -m "cliplite ${VER}" && git push

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
